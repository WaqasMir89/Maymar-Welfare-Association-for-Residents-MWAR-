{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container narrow page">
  <div class="card">
    <h1>{% trans "Record payment" %}</h1>
    <p class="muted">{{ invoice.property }} — {{ invoice.period_start|date:"F Y" }}</p>
    <p>{% trans "Balance due:" %} <strong>Rs {{ invoice.balance|floatformat:0 }}</strong></p>
    <form method="post" class="stack">
      {% csrf_token %}
      <input type="hidden" name="idempotency_key" value="{{ invoice.pk }}-{% now 'U' %}">
      <div class="field"><label>{% trans "Amount (PKR)" %}</label><input type="number" step="0.01" name="amount" value="{{ invoice.balance }}" required></div>
      <div class="field"><label>{% trans "Method" %}</label>
        <select name="method"><option value="cash">{% trans "Cash" %}</option><option value="bank_transfer">{% trans "Bank transfer" %}</option><option value="jazzcash">JazzCash</option><option value="easypaisa">EasyPaisa</option></select></div>
      <div class="field"><label>{% trans "Reference (optional)" %}</label><input type="text" name="reference"></div>
      <button class="btn btn-success" type="submit">{% trans "Record & issue receipt" %}</button>
    </form>
  </div>
</div>
{% endblock %}
