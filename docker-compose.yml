# Phase-1 topology per doc 07: nginx + gunicorn + postgres.
# No Redis/Celery/Prometheus yet — django-q2 (or cron) covers async when added.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mwar
      POSTGRES_USER: mwar
      POSTGRES_PASSWORD: mwar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwar"]
      interval: 10s
      retries: 5

  web:
    build: .
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me}
      CNIC_ENCRYPTION_KEY: ${CNIC_ENCRYPTION_KEY:-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://mwar:mwar@db:5432/mwar
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - private_media:/app/private_media
    expose:
      - "8000"

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  media:
  private_media:
